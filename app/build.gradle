plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
 namespace 'com.ives.zhihulite'
 compileSdk 35
 defaultConfig { applicationId 'com.ives.zhihulite'; minSdk 26; targetSdk 35; versionCode 10; versionName '0.2.0'; testInstrumentationRunner 'com.ives.zhihulite.AccountCheck' }
 buildFeatures { compose true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; signingConfig signingConfigs.debug } }
}
dependencies {
 implementation 'androidx.activity:activity-compose:1.9.3'
 implementation 'androidx.compose.ui:ui:1.7.6'
 implementation 'androidx.compose.foundation:foundation:1.7.6'
 implementation 'androidx.compose.material3:material3:1.3.1'
 implementation 'androidx.compose.material:material-icons-core:1.7.6'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
 implementation 'io.coil-kt:coil-compose:2.7.0'
 implementation 'org.jsoup:jsoup:1.18.3'
 implementation 'androidx.room:room-runtime:2.6.1'
 annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
